name: Keep Render service awake

on:
  schedule:
    # Every 10 minutes, offset from :00 to reduce GitHub scheduler congestion.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public health endpoint only
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            --user-agent "focus-business-render-keepalive/1.0" \
            "https://focus-prospeccion-fb.onrender.com/health"
